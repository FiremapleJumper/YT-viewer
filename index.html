<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Video Viewer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #10131a; color: #f4f6fb; padding: 24px; }
    main { width: min(850px, 100%); }
    h1 { margin-bottom: 8px; }
    p { color: #b8c0d0; line-height: 1.5; }
    .panel { background: #1b2130; border: 1px solid #30394d; border-radius: 16px; padding: 20px; }
    label { display: block; margin: 16px 0 8px; font-weight: 650; }
    input { box-sizing: border-box; width: 100%; padding: 13px; border-radius: 9px;
            border: 1px solid #46516a; background: #0e1420; color: white; font: inherit; }
    button, a.button { display: inline-block; margin: 12px 8px 0 0; padding: 11px 16px;
            border: 0; border-radius: 9px; background: #4779e8; color: white;
            font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
    button.secondary { background: #39445a; }
    .video { margin-top: 20px; aspect-ratio: 16 / 9; background: #080b10; border-radius: 12px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; }
    #status { min-height: 1.5em; color: #a9d5ff; }
    .small { font-size: .9rem; }
  </style>
</head>
<body>
<main>
  <h1>YouTube Video Viewer</h1>
  <p>Paste a YouTube link to watch or share it. This page does not ask for or store Google passwords.</p>
  <section class="panel">
    <label for="url">YouTube video link</label>
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
    <div>
      <button id="load">Load video</button>
      <button id="share" class="secondary">Copy share link</button>
      <a id="open" class="button" href="#" target="_blank" rel="noopener noreferrer" hidden>Open on YouTube</a>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="video" id="video" hidden>
      <iframe id="player" title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </section>
  <p class="small">Views are counted by YouTube according to its own systems. Repeated or automated playback is not a way to guarantee additional views.</p>
</main>
<script>
  const input = document.getElementById('url');
  const status = document.getElementById('status');
  const videoBox = document.getElementById('video');
  const player = document.getElementById('player');
  const openLink = document.getElementById('open');
  let canonicalUrl = '';

  function getVideoId(raw) {
    try {
      const u = new URL(raw);
      let id = '';
      if (u.hostname === 'youtu.be' || u.hostname.endsWith('.youtu.be')) {
        id = u.pathname.split('/').filter(Boolean)[0] || '';
      } else if (u.hostname === 'youtube.com' || u.hostname.endsWith('.youtube.com')
                 || u.hostname === 'm.youtube.com') {
        if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
        else if (/^\/(embed|shorts)\//.test(u.pathname)) id = u.pathname.split('/')[2] || '';
      }
      return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
    } catch { return null; }
  }

  document.getElementById('load').addEventListener('click', () => {
    const id = getVideoId(input.value.trim());
    if (!id) {
      status.textContent = 'Please enter a valid YouTube video URL.';
      videoBox.hidden = true;
      openLink.hidden = true;
      player.src = '';
      canonicalUrl = '';
      return;
    }
    canonicalUrl = 'https://www.youtube.com/watch?v=' + id;
    player.src = 'https://www.youtube-nocookie.com/embed/' + id;
    videoBox.hidden = false;
    openLink.href = canonicalUrl;
    openLink.hidden = false;
    status.textContent = 'Video loaded. Press play to watch.';
  });

  document.getElementById('share').addEventListener('click', async () => {
    if (!canonicalUrl) {
      status.textContent = 'Load a video first.';
      return;
    }
    try {
      await navigator.clipboard.writeText(canonicalUrl);
      status.textContent = 'Video link copied!';
    } catch {
      status.textContent = 'Copy was blocked by the browser. You can copy the link from the box above.';
      input.value = canonicalUrl;
      input.focus();
      input.select();
    }
  });
</script>
</body>
</html>
